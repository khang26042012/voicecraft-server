name: Build VoiceCraft Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'VoiceCraft version tag'
        required: true
        default: 'v1.7.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: voicecraft-server:${{ inputs.version || 'v1.7.1' }}
          build-args: |
            VERSION=${{ inputs.version || 'v1.7.1' }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to tar
        run: |
          docker save voicecraft-server:${{ inputs.version || 'v1.7.1' }} | gzip > voicecraft-image-${{ inputs.version || 'v1.7.1' }}.tar.gz
          ls -la voicecraft-image-*.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicecraft-image-${{ inputs.version || 'v1.7.1' }}
          path: voicecraft-image-*.tar.gz
          retention-days: 3
