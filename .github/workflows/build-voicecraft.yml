name: Build VoiceCraft Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'VoiceCraft version tag'
        required: true
        default: 'v1.7.1'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/khang26042012/voicecraft-server:${{ inputs.version || 'v1.7.1' }}
            ghcr.io/khang26042012/voicecraft-server:latest
          build-args: |
            VERSION=${{ inputs.version || 'v1.7.1' }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
